[package]
name = "ontoreport"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Quality report for OWL ontologies built from the project record: structure, reuse fidelity, traceability, provenance, requirements and review status"
authors = ["Antonio Zaitoun <antonio@zaitoun.dev>"]
license = "MIT"
repository = "https://github.com/Minitour/ontoreport"
homepage = "https://github.com/Minitour/ontoreport"
readme = "README.md"
keywords = ["ontology", "owl", "evaluation", "quality", "report"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "ontoreport"
path = "src/main.rs"

[lib]
name = "ontoreport"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
horned-owl = "1.4"
# Pinned past whelk's June 2026 rule fixes (#30, #31); the earlier revision OWL-MCP pins reports
# false unsatisfiable classes and different results on each run.
whelk = { git = "https://github.com/INCATools/whelk-rs", rev = "a1f7e54f62e1a5d8be6af73693076bc04c95faa9" }
oxrdfio = "0.2"
oxrdf = "0.3"
# Sentence embeddings for the coherence and corpus-fit sections: pure Rust, so every release target
# builds without a native runtime. The model is downloaded on first use (see src/config.rs).
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
toml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
